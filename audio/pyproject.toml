[project]
name = "studio-audio"
version = "0.1.0"
description = "Voice, music, sound effects and mixing workers for Video Studio."
requires-python = ">=3.11,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "music21>=9.1",
    "pydub>=0.25",
    "scipy>=1.11",
    "numpy>=1.26",
    "pyloudnorm>=0.1.1",
    # Keep the resolver on releases that ship Windows wheels (older ones need a Rust compiler).
    "transformers>=4.40",
    "tokenizers>=0.19",
    # English grammar model Kokoro's phonemizer (misaki) loads; locked so it is never fetched at run time.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files stay inside the project, not in the system temporary folder (lesson L-0018).
addopts = ["--basetemp=../.cache/pytest-audio"]

[tool.hatch.metadata]
# Needed for the pinned en-core-web-sm wheel URL above.
allow-direct-references = true
